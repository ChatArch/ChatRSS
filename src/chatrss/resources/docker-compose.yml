services:
  rsshub:
    image: diygod/rsshub
    restart: always
    ports:
      - "${RSSHUB_PORT:-1200}:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      # GitHub Token（可选，提升 API 限速）
      # GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
